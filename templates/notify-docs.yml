# Copy to .github/workflows/notify-docs.yml in each enrolled repo.
#
# Tells flex-docs to rebuild when this repo's main branch changes.
# Needs a secret DOCS_DISPATCH_TOKEN: a fine-grained token (or GitHub App token)
# with "Contents: read and write" on flex-pse/flex-docs only.

name: notify docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Send repository_dispatch to the docs site
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          gh api repos/flex-pse/flex-docs/dispatches \
            -f event_type=docs-updated \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[sha]=${{ github.sha }}"
